```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Basics</title>

  <style>

    /* Body Styling */
    body{
      background-color: #f0f8ff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Heading */
    h1{
      color: blue;
      text-align: center;
      margin-top: 20px;
    }

    /* Paragraph */
    p{
      color: green;
      font-size: 20px;
      text-align: center;
    }

    /* Box */
    .box{
      width: 300px;
      height: 150px;
      background-color: orange;
      border: 3px solid black;
      margin: 30px auto;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      border-radius: 10px;
    }

    /* Button */
    button{
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: black;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover{
      background-color: red;
    }

    /* Flexbox */
    .container{
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .item{
      width: 100px;
      height: 100px;
      background-color: purple;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      border-radius: 10px;
    }

    /* Animation */
    .circle{
      width: 80px;
      height: 80px;
      background-color: red;
      border-radius: 50%;
      margin: 40px auto;

      animation: move 2s infinite alternate;
    }

    @keyframes move{
      from{
        transform: translateX(-100px);
      }

      to{
        transform: translateX(100px);
      }
    }

  </style>
</head>

<body>

  <h1>CSS Complete Basic Demo</h1>

  <p>This page contains basic CSS properties.</p>

  <div class="box">
    Box with Margin, Padding & Border
  </div>

  <button>Click Me</button>

  <!-- Flexbox -->
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

  <!-- Animation -->
  <div class="circle"></div>

</body>
</html>
```
